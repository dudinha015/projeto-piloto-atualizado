<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Produto Detalhe</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

<div class="w-full max-w-[1400px] mx-auto p-6 grid md:grid-cols-2 gap-10">

  <!-- GALERIA DE IMAGENS -->
  <div class="bg-white p-6 rounded-xl shadow">
    <div class="grid grid-cols-[100px_1fr] gap-6">

      <!-- MINIATURAS -->
      <div class="flex flex-col gap-3">
        <img id="thumb1" class="w-20 h-20 object-contain border rounded cursor-pointer">
        <img id="thumb2" class="w-20 h-20 object-contain border rounded cursor-pointer">
      </div>

      <!-- IMAGEM PRINCIPAL -->
      <div>
        <img id="img" style="width:100%; height:650px; object-fit:contain;" class="rounded-lg">
      </div>
    </div>
  </div>

  <!-- INFORMAÇÕES DO PRODUTO -->
  <div>
    <h1 id="nome" class="text-3xl font-bold"></h1>

    <!-- Avaliação (exemplo fixo) -->
    <div class="text-yellow-400 mt-2">
      ★★★★☆ <span class="text-gray-600 text-sm">(4.5)</span>
    </div>

    <!-- Descrição curta -->
    <p id="descricao" class="text-gray-600 mt-3"></p>

    <!-- Preços -->
    <p class="text-gray-400 line-through mt-4">
      R$ <span id="precoAntigo"></span>
    </p>
    <p id="preco" class="text-4xl font-bold text-blue-600"></p>
    <span class="bg-yellow-200 text-yellow-800 px-2 py-1 rounded text-xs">12% OFF</span>

    <!-- Quantidade -->
    <div class="flex items-center gap-3 mt-6">
      <button onclick="diminuir()" class="px-3 py-1 bg-gray-200 rounded">-</button>
      <input id="qtd" value="1" class="w-12 text-center border rounded">
      <button onclick="aumentar()" class="px-3 py-1 bg-gray-200 rounded">+</button>
    </div>

    <!-- Botão -->
    <button class="mt-6 bg-gradient-to-r from-blue-600 to-blue-400 text-white px-6 py-3 rounded-xl w-full hover:scale-105 transition">
      🛒 Adicionar à sacola
    </button>

    <!-- Benefícios -->
    <ul id="beneficios" class="mt-6 text-sm text-gray-700 space-y-1"></ul>

    <!-- Descrição completa -->
    <div class="mt-6">
      <h3 class="font-bold text-lg">Descrição</h3>
      <p id="descricao2" class="text-gray-600 mt-2"></p>
    </div>
  </div>

</div>

<script>
const produtosFake = JSON.parse(localStorage.getItem("produtosFake") || "[]");
const id = new URLSearchParams(window.location.search).get("id");
const produto = produtosFake.find(p => p.id == id);

if(!produto){
  document.body.innerHTML = "<h1>Produto não encontrado</h1>";
}

// Dados básicos
document.getElementById("img").src = produto.imagem;
document.getElementById("nome").innerText = produto.nome;
document.getElementById("descricao").innerText = produto.descricao;
document.getElementById("preco").innerText = "R$ " + produto.preco;
document.getElementById("precoAntigo").innerText = (produto.preco + 20).toFixed(2);

// Benefícios
const listaBeneficios = document.getElementById("beneficios");
listaBeneficios.innerHTML = "";
if(produto.beneficios && produto.beneficios.length > 0){
  produto.beneficios.forEach(b => {
    const li = document.createElement("li");
    li.innerText = "✔ " + b;
    listaBeneficios.appendChild(li);
  });
} else {
  ["Alta absorção", "Controle de odor", "Produto de qualidade"].forEach(b => {
    const li = document.createElement("li");
    li.innerText = "✔ " + b;
    listaBeneficios.appendChild(li);
  });
}

// Descrição completa
document.getElementById("descricao2").innerHTML = produto.descricaoCompleta || `
  <strong>Sobre este produto:</strong><br><br>
  ${produto.descricao}<br><br>
  ✔ Produto selecionado com alta qualidade<br>
  ✔ Ideal para uso diário do seu pet<br>
  ✔ Ótimo custo-benefício
`;

// Miniaturas
document.getElementById("thumb1").src = produto.imagem;
document.getElementById("thumb2").src = produto.imagem;
document.getElementById("thumb1").onclick = () => { document.getElementById("img").src = produto.imagem; };
document.getElementById("thumb2").onclick = () => { document.getElementById("img").src = produto.imagem; };

// Quantidade
function aumentar(){ let q = document.getElementById("qtd"); q.value = parseInt(q.value) + 1; }
function diminuir(){ let q = document.getElementById("qtd"); if(q.value>1) q.value--; }
</script>

</body>
</html>
