// salvar no localStorage
localStorage.setItem("produtosFake", JSON.stringify(produtosFake));

// pegar categoria da URL
const params = new URLSearchParams(window.location.search);
const categoriaId = parseInt(params.get("categoria"));
const container = document.getElementById("produtos");

// filtrar produtos por categoria
const filtrados = produtosFake.filter(p => p.categoria === categoriaId);

if (filtrados.length === 0) {
  container.innerHTML = "<p>Nenhum produto encontrado.</p>";
}

filtrados.forEach(p => {
  container.innerHTML += `
    <div class="bg-white rounded-xl p-4 shadow hover:shadow-lg cursor-pointer transition"
         onclick="verProduto(${p.id})">

      <img src="${p.imagem}" class="h-40 mx-auto object-contain">

      <h2 class="font-semibold mt-2 text-sm">${p.nome}</h2>

      <p class="text-gray-400 line-through text-xs">
        R$ ${(p.preco + 20).toFixed(2)}
      </p>

      <p class="text-lg font-bold text-gray-800">
        R$ ${p.preco.toFixed(2)}
      </p>

      <button class="mt-2 w-full bg-blue-600 text-white py-2 rounded-lg">
        Ver produto
      </button>
    </div>
  `;
});

function verProduto(id){
  window.location.href = "produto-detalhe.html?id=" + id;
}
