<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produto</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

  <div class="max-w-7xl mx-auto px-6 py-10">

    <div id="produto"
      class="bg-white rounded-2xl shadow-lg p-8 grid md:grid-cols-2 gap-10">
    </div>

  </div>

  <script>

    const params = new URLSearchParams(window.location.search);

    const id = params.get("id");

    async function carregarProduto() {

      const res = await fetch(
        `http://localhost:8081/produtos/${id}`
      );

      const produto = await res.json();

      document.getElementById("produto").innerHTML = `
      
        <div>
          <img src="${produto.imagem}"
               class="w-full rounded-2xl">
        </div>

        <div>

          <h1 class="text-4xl font-bold mb-4">
            ${produto.nome}
          </h1>

          <p class="text-gray-600 mb-6">
            ${produto.descricao}
          </p>

          <p class="text-4xl font-bold text-blue-600 mb-4">
            R$ ${produto.precoDesconto}
          </p>

          <p class="text-gray-500 line-through mb-6">
            R$ ${produto.preco}
          </p>

          <div class="mb-6">

            <span class="font-bold">
              Estoque:
            </span>

            ${produto.qtdEstoque} unidades

          </div>

          <button
            class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-4 rounded-xl text-lg font-bold">
            Adicionar ao Carrinho
          </button>

        </div>
      
      `;
    }

    carregarProduto();

  </script>

</body>
</html>
